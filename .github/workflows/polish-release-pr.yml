name: Polish Release PR (next)

# When release-please opens or updates the release PR on the `next` branch,
# this workflow asks an LLM (via your CLI Proxy API) to rewrite the
# auto-generated changelog entry and the PR body in user-facing language.
#
# Triggered only on PRs that release-please labelled with `autorelease: pending`.
# Skipped silently when the label isn't present (e.g. regular PRs).
#
# Required repository secrets:
#   LLM_PROXY_URL  - Proxy API root, including /v1  (e.g. https://llm-api.example.com/v1)
#   LLM_PROXY_KEY  - Bearer token your proxy accepts
#   RELEASE_TOKEN  - PAT with contents:write + pull-requests:write
#                    (same secret release-please-next.yml uses)
#
# Change LLM_MODEL below to swap the backing model. Any model name your proxy
# routes will work (claude-sonnet-4-6, claude-opus-4-7, gpt-4o, etc.).

on:
  pull_request:
    branches:
      - next
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  polish:
    if: "contains(github.event.pull_request.labels.*.name, 'autorelease: pending')"
    runs-on: ubuntu-latest
    env:
      LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
      LLM_PROXY_KEY: ${{ secrets.LLM_PROXY_KEY }}
      LLM_MODEL: claude-sonnet-4-6

    steps:
      - name: Checkout default
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Switch to release PR branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Skip if last commit is our own polish
        id: guard
        run: |
          last_subject=$(git log -1 --format=%s)
          if [ "$last_subject" = "docs(changelog): polish release notes" ]; then
            echo "Last commit is the polish bot's own commit - skipping to avoid loop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git author
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Polish changelog via LLM proxy
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log --no-merges "$PREV_TAG"..HEAD --pretty=format:'%h %s%n%b%n---')
          CHANGELOG_FILE=docs/01-getting-started/30-changelog.md

          # Split the changelog into three pieces:
          #   HEADER      = front matter + title (everything before the first '## ' heading)
          #   NEWEST      = the most recent entry (from the first '## ' through the line before the second '## ')
          #   OLDER       = everything from the second '## ' to EOF (older releases — never modified)
          # This guarantees older entries stay byte-for-byte identical regardless of what the LLM returns.
          awk '
            BEGIN { section = 0 }
            /^## / { section++ }
            section == 0 { print > "/tmp/cl-header.md" }
            section == 1 { print > "/tmp/cl-newest.md" }
            section >= 2 { print > "/tmp/cl-older.md" }
          ' "$CHANGELOG_FILE"

          if [ ! -s /tmp/cl-newest.md ]; then
            echo "::warning::Could not locate a newest entry in the changelog — skipping polish."
            exit 0
          fi

          # Ensure all three files exist even if some are empty.
          touch /tmp/cl-header.md /tmp/cl-older.md

          # Further split the newest entry into:
          #   HEADING    = the first line (the '## [version](...)' heading + date)
          #   BULLETS    = everything after the heading (the auto-generated sections + bullets)
          # We send only BULLETS (with the heading for context) to the LLM and ask it to
          # produce ONLY a paragraph or two of prose. We then splice:
          #   heading + blank line + LLM prose + blank line + original BULLETS
          # The original bullet list stays exactly as release-please generated it.
          head -1 /tmp/cl-newest.md > /tmp/cl-heading.md
          tail -n +2 /tmp/cl-newest.md > /tmp/cl-bullets.md

          BULLETS=$(cat /tmp/cl-bullets.md)
          HEADING=$(cat /tmp/cl-heading.md)

          SYSTEM_PROMPT=$(cat <<'EOF'
          You are writing a short, friendly intro for one MilliCache release. MilliCache is a WordPress plugin that makes sites faster by caching pages.

          The release's auto-generated bullet list will appear AFTER your text in the published changelog (the workflow handles the splicing). So do NOT include the bullets, the version heading, or any section headings (Features, Bug Fixes, etc.) in your output. Just produce the prose introduction that goes BETWEEN the heading and the bullets.

          AUDIENCE: a regular WordPress site owner. They write posts, install plugins, manage their site through the dashboard. They do NOT read PHP, they do NOT know what Redis is, they do NOT recognize class names like "Resolver" or "Hasher" or "Cache Manager", they do NOT care about commit messages, file paths, or implementation details. If they wanted to read source code they'd be reading the source code, not the changelog.

          TONE: friendly, plain English. You can be a bit funny when it fits naturally — don't force it. Use a simple example to illustrate a change when it helps the reader picture what it means for them ("if you run a shop with different language versions of the same page..."). Concrete and specific beats abstract and general.

          STRICT WHAT-NOT-TO-DO RULES:

          1. NO TECHNICAL JARGON. Never mention any of these:
             - Class names, function names, method names (e.g. "Resolver::add()", "the Hasher class")
             - Internal API names (e.g. "Reader/Writer/Manager APIs", "the Storage layer")
             - Implementation details (e.g. "content-addressable keyspace", "SHA-1 hashes", "ref-counted GC", "<prefix>:o:<hash>", "Redis MGET")
             - File paths or directory names (e.g. "src/Engine/Cache/")
             - Phrases like "under the hood", "internally", "the X layer" — these signal you're about to leak implementation detail
             - "PHP-phase", "WordPress-phase", or other engine-internal terms

             If you can't explain a change without one of these, you're describing it at the wrong level. Step back: what does this CHANGE FOR THE USER? Describe that.

          2. NEVER FABRICATE CAPABILITIES. Do not write phrases like:
             - "no code changes required"
             - "no setup needed"
             - "automatically"
             - "out of the box"
             - "configure it from the admin"
             - "with one click"
             ...unless the bullets EXPLICITLY say so. MilliCache free has no admin UI for rules — defining a rule requires writing code in a settings or PHP file. Even when a feature works "automatically" in the sense that no manual flag is needed, do not say so unless the bullets confirm it.

          3. STAY GROUNDED IN THE BULLETS. Every claim in your prose must trace back to something in the bullet list you received. If you can't point to the bullet that supports a sentence, delete the sentence.

          4. WHEN UNSURE, OMIT. A short, vague intro ("This release improves how MilliCache handles X") is much better than a confident wrong claim.

          OUTPUT FORMAT (strict):
          - Output ONLY prose paragraphs. No version heading. No bullets. No section headings. No code fences. No preamble like "Here is the summary".
          - Length: 1–3 short paragraphs. For a release with only one bug fix, a single sentence is enough.
          - Do not end with a sign-off, signature, or "Happy caching!" type closer. Just stop after the last sentence.
          EOF
          )

          USER_CONTENT=$(printf 'Release heading (for context, do NOT repeat in output):\n\n%s\n\nAuto-generated changelog sections + bullets (write a friendly intro for these — do NOT include them in output):\n\n%s\n\n---\n\nRecent commits (additional context, do not include verbatim):\n\n%s' "$HEADING" "$BULLETS" "$COMMITS")

          PAYLOAD=$(jq -n \
            --arg model    "$LLM_MODEL" \
            --arg system   "$SYSTEM_PROMPT" \
            --arg user     "$USER_CONTENT" \
            '{
               model: $model,
               temperature: 0.4,
               messages: [
                 { role: "system", content: $system },
                 { role: "user",   content: $user }
               ]
             }')

          response=$(curl -fsS "$LLM_PROXY_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_PROXY_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$response" | jq -r '.choices[0].message.content' > /tmp/cl-prose.md

          if [ ! -s /tmp/cl-prose.md ]; then
            echo "::warning::Polished prose came back empty — keeping the auto-generated entry."
            exit 0
          fi

          # Defensive cleanup: if the LLM violated instructions and included a heading or
          # bullets, strip them so we don't end up with duplicates after splicing.
          # 1. Drop any leading lines that start with '#' (heading the LLM accidentally included).
          # 2. Stop at the first '### Features' or '### Bug Fixes' line if the LLM started
          #    pasting the bullets back.
          awk '
            BEGIN { started = 0 }
            /^### (Features|Bug Fixes|Performance|Dependencies)/ { exit }
            !started && /^#/ { next }
            !started && /^$/ { next }
            { started = 1; print }
          ' /tmp/cl-prose.md > /tmp/cl-prose-clean.md

          if [ ! -s /tmp/cl-prose-clean.md ]; then
            echo "::warning::Polished prose was empty after cleanup — keeping the auto-generated entry."
            exit 0
          fi

          # Reassemble the newest entry: heading + blank + prose + blank + original bullets.
          {
            cat /tmp/cl-heading.md
            printf '\n'
            cat /tmp/cl-prose-clean.md
            # Ensure trailing blank line on the prose if missing.
            if [ -n "$(tail -c 1 /tmp/cl-prose-clean.md 2>/dev/null)" ]; then printf '\n'; fi
            printf '\n'
            cat /tmp/cl-bullets.md
          } > /tmp/cl-newest-final.md

          # Reassemble the full changelog: header + polished newest + older entries.
          cat /tmp/cl-header.md /tmp/cl-newest-final.md /tmp/cl-older.md > "$CHANGELOG_FILE"

          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "::error::Reassembled changelog is empty — aborting."
            exit 1
          fi

      - name: Generate PR body via LLM proxy
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          NEWEST=$(awk '/^## /{n++; if(n==2) exit} {print}' docs/01-getting-started/30-changelog.md)

          SYSTEM_PROMPT=$(cat <<'EOF'
          Write a pull-request description for a MilliCache release. The audience is the maintainer reviewing the release PR plus anyone reading the merged commit later (including non-engineers who want to know what this release changed for them).

          Tone: friendly, plain English, no deep jargon. A bit of humor is fine where it fits naturally — don't force it. Use simple examples to illustrate user-visible changes when it helps.

          Structure:
          - One-sentence summary at the top, written for a regular WordPress user.
          - Grouped highlights (Features, Fixes, Performance, Dependencies — only the sections that actually have content).
          - Short "Testing" line referencing Pest unit tests, PHPStan max, and the e2e gate.
          - Closing: link to the file docs/01-getting-started/30-changelog.md for the full entry.

          STRICT ACCURACY RULES:
          - Describe only what the changelog entry you receive actually claims. Do not invent UIs, admin features, CLI commands, or workflows. MilliCache free has no admin UI for rules — don't claim otherwise.
          - Do not promise behaviour ("works automatically", "no setup required") unless the changelog entry says so.
          - When unsure, omit. Brevity beats fabrication.

          Output is the raw markdown body, no fences or wrappers.
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg model   "$LLM_MODEL" \
            --arg system  "$SYSTEM_PROMPT" \
            --arg user    "$NEWEST" \
            '{
               model: $model,
               temperature: 0.4,
               messages: [
                 { role: "system", content: $system },
                 { role: "user",   content: ("Newest changelog entry:\n\n" + $user) }
               ]
             }')

          curl -fsS "$LLM_PROXY_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_PROXY_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            | jq -r '.choices[0].message.content' \
            > /tmp/pr-body.md

          if [ ! -s /tmp/pr-body.md ]; then
            echo "::warning::PR body came back empty - leaving release-please's default in place."
            rm -f /tmp/pr-body.md
          fi

      - name: Commit + push polished changelog
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet docs/01-getting-started/30-changelog.md; then
            echo "No changes from the rewrite - skipping commit."
          else
            git add docs/01-getting-started/30-changelog.md
            git commit -m "docs(changelog): polish release notes"
            git push origin HEAD
          fi

      - name: Update PR description
        if: steps.guard.outputs.skip != 'true' && hashFiles('/tmp/pr-body.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md --repo "$REPO"
