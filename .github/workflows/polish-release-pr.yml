name: Polish Release PR

# Thin caller: the polish machinery lives in MilliPress/action-polish-release-pr.
# It adds a prose intro to the newest changelog entry on release PRs and,
# when composer.lock ships a new MilliBase, hands that framework's release
# notes to the LLM as intro material (prose only, no published appendix).
# The product voice lives in .github/polish/system-prompt.md.
# release-bundle.yml strips the mc:auto markers before publishing.

on:
  pull_request:
    branches:
      - main
      - next
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  polish:
    if: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: MilliPress/action-polish-release-pr@v1
        with:
          changelog-path: docs/01-getting-started/30-changelog.md
          prompt-path: .github/polish/system-prompt.md
          constants-path: docs/02-configuration/02-reference.md
          dep-name: MilliBase
          dep-repo: MilliPress/MilliBase
          dep-probe: composer-lock
          dep-probe-path: composer.lock
          dep-package: millipress/millibase
          dep-appendix: 'false'
          bot-client-id: ${{ secrets.MILLIPRESS_BOT_CLIENT_ID }}
          bot-private-key: ${{ secrets.MILLIPRESS_BOT_PRIVATE_KEY }}
          llm-proxy-url: ${{ secrets.LLM_PROXY_URL }}
          llm-proxy-key: ${{ secrets.LLM_PROXY_KEY }}
