name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0-rc.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build JS assets
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create dist build
        run: |
          rm -rf dist && mkdir dist

          # Export tracked files (respects .gitattributes export-ignore)
          git archive --format=tar HEAD | tar -x -C dist

          # Add build artifacts and dependencies
          [ -d build ] && rsync -a build/ dist/build/
          [ -d vendor ] && rsync -a vendor/ dist/vendor/
          [ -d deps ] && rsync -a deps/ dist/deps/

          echo "Dist contents:"
          ls -la dist/

      - name: Create release archive
        run: |
          cd dist
          zip -rq "../millicache-${{ inputs.tag }}.zip" .
          cd ..

      - name: Update tag to include built dependencies
        run: |
          TAG="${{ inputs.tag }}"
          ORIGINAL_SHA=$(git rev-parse HEAD)

          # Stash current state
          git stash --include-untracked || true

          # Create orphan branch for dist
          git switch --orphan "dist/${TAG}"
          git rm -rf . >/dev/null 2>&1 || true

          # Move dist contents to root
          rsync -a dist/ . --remove-source-files
          rm -rf dist/

          # Commit the dist build
          git add -A
          git commit -m "Release ${TAG}"

          # Update the tag to point to this commit (with built deps)
          git tag -f "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}" --force

          echo "Tag ${TAG} updated to include built dependencies"

          # Return to original commit
          git checkout "${ORIGINAL_SHA}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "Release ${{ steps.version.outputs.version }}"
          files: millicache-${{ inputs.tag }}.zip
          prerelease: ${{ contains(inputs.tag, 'rc') || contains(inputs.tag, 'beta') || contains(inputs.tag, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo "## Release ${{ inputs.tag }} Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Tag | ${{ inputs.tag }} |"
            echo ""
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }})"
          } >> $GITHUB_STEP_SUMMARY
