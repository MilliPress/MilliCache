name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0-rc.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build dist
        run: ./.github/scripts/build-dist.sh

      - name: Create release archive
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd dist
          zip -rq "../millicache-${TAG}.zip" .
          cd ..

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "Release ${{ steps.version.outputs.version }}"
          files: millicache-${{ inputs.tag }}.zip
          prerelease: ${{ contains(inputs.tag, 'rc') || contains(inputs.tag, 'beta') || contains(inputs.tag, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo "## Release ${{ inputs.tag }} Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Tag | ${{ inputs.tag }} |"
            echo ""
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }})"
          } >> $GITHUB_STEP_SUMMARY
