name: CI

on:
  workflow_call:
  # workflow_dispatch is used by the auto-rebuild step below to re-run the
  # full check suite on a bot-pushed rebuild commit (push events from inside a
  # workflow run are suppressed by GitHub's anti-recursion guard, but
  # workflow_dispatch is exempt).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'phpcs.xml'
      - 'millicache.php'
      - 'advanced-cache.php'
      - 'functions.php'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
  pull_request:
    branches: [main, dev]
    # No paths filter - always run CI on PRs to catch issues before merge

permissions:
  contents: write

jobs:
  build-assets:
    name: Build Assets
    runs-on: ubuntu-latest
    # On push to main: rebuild and auto-commit. On same-repo PR: rebuild and
    # auto-commit to the PR branch. On fork PR: verify only (auto-push not
    # authorized into forks).
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          # Default GITHUB_TOKEN at checkout time — never expose RELEASE_TOKEN
          # to npm postinstall scripts. The push step below sets the PAT only
          # in its own env scope.
          token: ${{ secrets.GITHUB_TOKEN }}
          # On same-repo PR: check out the PR's head branch directly so the
          # rebuild commit goes onto the right ref. On fork PR or push:
          # default ref (merge ref / main).
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Auto-rebuild & push (push or same-repo PR)
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          PAT: ${{ secrets.RELEASE_TOKEN }}
          # On PR: push back to the PR branch. On push: stay on main.
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
          # Skip CI on push-to-main rebuilds so release-please doesn't
          # re-trigger pointlessly. On PR rebuilds, allow CI to re-run so the
          # build-assets check goes green on the rebuild commit.
          MSG_SUFFIX: ${{ github.event_name == 'push' && ' [skip ci]' || '' }}
        run: |
          git add build/
          if git diff --cached --quiet; then
            echo "build/ is in sync with source — no rebuild needed."
            exit 0
          fi
          if [ -z "$PAT" ]; then
            echo "::error::RELEASE_TOKEN is not available in this workflow context."
            echo "::error::For Dependabot PRs: add RELEASE_TOKEN under Settings → Secrets and variables → Dependabot so the rebuild can be auto-pushed back to the PR branch."
            git --no-pager diff --stat build/
            exit 1
          fi
          git -c user.name="MilliPress CI" \
              -c user.email="ci@millipress.dev" \
              commit -m "chore: rebuild assets${MSG_SUFFIX}"
          git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_REF}"
          echo "Pushed rebuild to '${TARGET_REF}'."

          # GitHub's anti-recursion guard suppresses push/pull_request events
          # for commits pushed from inside a workflow run, even via a PAT, so
          # ci.yml will not re-fire on synchronize. Explicitly dispatch the
          # workflow on the just-pushed ref so all jobs (including required
          # checks like Unit Tests / PHPStan / WordPress Code Style) attach
          # their results to the rebuild commit and the PR can be merged.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GH_TOKEN="$PAT" gh workflow run ci.yml --ref "${TARGET_REF}" --repo "${GITHUB_REPOSITORY}"
            echo "Dispatched ci.yml on '${TARGET_REF}' to refresh required checks."
          fi

      - name: Verify build (fork PRs only)
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if git diff --quiet build/; then
            echo "build/ is in sync with source."
          else
            echo "::error::build/ is out of sync with source. Fork PRs require manual rebuild by a maintainer."
            git --no-pager diff --stat build/
            exit 1
          fi

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pest 4.x requires PHP 8.3+, so we only test on supported versions
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: composer test:unit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer test:phpstan

  phpcs:
    name: WordPress Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer test:lint
