name: CI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'phpcs.xml'
      - 'millicache.php'
      - 'advanced-cache.php'
      - 'functions.php'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
  pull_request:
    branches: [main, dev]
    # No paths filter - always run CI on PRs to catch issues before merge

permissions:
  contents: write

jobs:
  build-assets:
    name: Build Assets
    runs-on: ubuntu-latest
    # On push to main: rebuild and auto-commit. On PR: verify only.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the bypass-capable PAT only on push (to commit the rebuild).
          # PR runs verify only, so they use the default GITHUB_TOKEN — this
          # avoids exposing the PAT to potentially untrusted PR code via npm
          # postinstall scripts.
          token: ${{ github.event_name == 'push' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Verify build is in sync (PRs)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet build/; then
            echo "build/ is in sync with source."
          else
            echo "::error::build/ is out of sync with source. Run 'npm run build' locally and commit the result."
            git --no-pager diff --stat build/
            exit 1
          fi

      - name: Commit build files (push to main)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/
          if git diff --cached --quiet; then
            echo "No changes to build files"
          else
            git commit -m "chore: rebuild assets [skip ci]"
            git push
          fi

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pest 4.x requires PHP 8.3+, so we only test on supported versions
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: composer test:unit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer test:phpstan

  phpcs:
    name: WordPress Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer test:lint
