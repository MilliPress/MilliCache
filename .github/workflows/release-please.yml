name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Gate: Run CI before building release
  ci:
    name: Run CI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/ci.yml

  # Gate: Run E2E after CI passes
  e2e:
    name: Run E2E
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/e2e.yml

  # Build and publish the release after all gates pass
  build-release:
    name: Build & Release
    needs: [release-please, ci, e2e]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build JS assets
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Install dependencies and build prefixed packages
        run: |
          # Install all dependencies (including dev) to get millirules and predis
          composer install --no-interaction --prefer-dist

          # Strauss runs via post-install-cmd and prefixes packages into deps/
          # Now reinstall without dev to clean vendor/ for production
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Download performance results
        uses: actions/download-artifact@v4
        with:
          name: performance-results
          path: /tmp/performance
        continue-on-error: true

      - name: Extract release notes for current version
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          CHANGELOG_PATH="docs/01-getting-started/30-changelog.md"

          # Extract only the current version's changelog section
          # Release Please format: ## [version] or ## version
          if [ -f "$CHANGELOG_PATH" ]; then
            # Extract from the version header until the next ## header (or EOF)
            awk -v ver="$VERSION" '
              /^## \[?[0-9]/ {
                if (found) exit
                if (index($0, ver)) found=1
              }
              found { print }
            ' "$CHANGELOG_PATH" > /tmp/changelog.md

            # If nothing was extracted, use a fallback
            if [ ! -s /tmp/changelog.md ]; then
              echo "## ${{ needs.release-please.outputs.tag_name }}" > /tmp/changelog.md
            fi
          else
            echo "## ${{ needs.release-please.outputs.tag_name }}" > /tmp/changelog.md
          fi

          echo "Release notes for version $VERSION:"
          cat /tmp/changelog.md

      - name: Append performance summary to changelog
        run: |
          if [ -f /tmp/performance/performance-results.md ]; then
            echo "" >> /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            cat /tmp/performance/performance-results.md >> /tmp/changelog.md
            echo "Performance summary appended to changelog"
          else
            echo "No performance results found, skipping"
          fi

      - name: Create dist build
        run: |
          rm -rf dist && mkdir dist

          # Export tracked files (respects .gitattributes export-ignore)
          git archive --format=tar HEAD | tar -x -C dist

          # Add build artifacts and dependencies
          [ -d build ] && rsync -a build/ dist/build/
          [ -d vendor ] && rsync -a vendor/ dist/vendor/
          [ -d deps ] && rsync -a deps/ dist/deps/

          echo "Dist contents:"
          ls -la dist/

      - name: Create release archive
        run: |
          cd dist
          zip -rq "../millicache-${{ needs.release-please.outputs.tag_name }}.zip" .
          cd ..

      - name: Update tag to include built dependencies
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"

          # Move dist and zip to temp location (outside git working tree)
          mv dist /tmp/dist-build
          mv "millicache-${TAG}.zip" /tmp/

          # Stash current state
          git stash --include-untracked || true

          # Create orphan branch for dist
          git switch --orphan "dist/${TAG}"
          git rm -rf . >/dev/null 2>&1 || true

          # Move dist contents to root
          rsync -a /tmp/dist-build/ . --remove-source-files
          rm -rf /tmp/dist-build/

          # Commit the dist build
          git add -A
          git commit -m "Release ${TAG}"

          # Update the tag to point to this commit (with built deps)
          git tag -f "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}" --force

          echo "Tag ${TAG} updated to include built dependencies"

          # Return to original branch
          git checkout ${{ needs.release-please.outputs.sha }}

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "/tmp/millicache-${{ needs.release-please.outputs.tag_name }}.zip" \
            --clobber

      - name: Update release notes with performance results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/changelog.md ] && [ -s /tmp/changelog.md ]; then
            gh release edit "${{ needs.release-please.outputs.tag_name }}" \
              --notes-file /tmp/changelog.md
            echo "Release notes updated with performance results"
          else
            echo "No changelog file found, skipping release notes update"
          fi

      - name: Release summary
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${{ needs.release-please.outputs.version }}"

          {
            echo "## Release ${TAG} Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Tag | ${TAG} |"
            echo ""
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${TAG})"
          } >> $GITHUB_STEP_SUMMARY
