name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-release: true

  # Gate: Run CI before building release
  ci:
    name: Run CI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/ci.yml

  # Gate: Run E2E after CI passes
  e2e:
    name: Run E2E
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/e2e.yml

  # Build and publish the release after all gates pass
  build-release:
    name: Build & Release
    needs: [release-please, ci, e2e]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build JS assets
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Download performance results
        uses: actions/download-artifact@v4
        with:
          name: performance-results
          path: /tmp/performance
        continue-on-error: true

      - name: Extract release notes for current version
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          CHANGELOG_PATH="docs/01-getting-started/30-changelog.md"

          # Extract only the current version's changelog section
          # Release Please format: ## [version] or ## version
          if [ -f "$CHANGELOG_PATH" ]; then
            # Extract from the version header until the next ## header (or EOF)
            awk -v ver="$VERSION" '
              /^## \[?[0-9]/ {
                if (found) exit
                if (index($0, ver)) found=1
              }
              found { print }
            ' "$CHANGELOG_PATH" > /tmp/changelog.md

            # If nothing was extracted, use a fallback
            if [ ! -s /tmp/changelog.md ]; then
              echo "## ${{ needs.release-please.outputs.tag_name }}" > /tmp/changelog.md
            fi
          else
            echo "## ${{ needs.release-please.outputs.tag_name }}" > /tmp/changelog.md
          fi

          echo "Release notes for version $VERSION:"
          cat /tmp/changelog.md

      - name: Append performance summary to changelog
        run: |
          if [ -f /tmp/performance/performance-results.md ]; then
            echo "" >> /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            cat /tmp/performance/performance-results.md >> /tmp/changelog.md
            echo "Performance summary appended to changelog"
          else
            echo "No performance results found, skipping"
          fi

      - name: Create dist build
        run: |
          rm -rf dist && mkdir dist

          # Export tracked files (respects .gitattributes export-ignore)
          git archive --format=tar HEAD | tar -x -C dist

          # Add build artifacts and dependencies
          [ -d build ] && rsync -a build/ dist/build/
          [ -d vendor ] && rsync -a vendor/ dist/vendor/
          [ -d deps ] && rsync -a deps/ dist/deps/

          echo "Dist contents:"
          ls -la dist/

      - name: Create release tag on orphan dist branch
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"

          # Delete the tag created by Release Please (if it exists)
          git push origin --delete "refs/tags/${TAG}" 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true

          # Create orphan branch for dist
          git switch --orphan "dist/${TAG}"
          git rm -rf . >/dev/null 2>&1 || true

          # Move dist contents to root
          rsync -a dist/ . --remove-source-files
          rm -rf dist/

          # Commit and tag
          git add -A
          git commit -m "Release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create release archive
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          zip -rq "millicache-${TAG}.zip" . -x ".git/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          name: ${{ needs.release-please.outputs.tag_name }}
          body_path: /tmp/changelog.md
          files: millicache-${{ needs.release-please.outputs.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${{ needs.release-please.outputs.version }}"

          {
            echo "## Release ${TAG} Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Tag | ${TAG} |"
            echo ""
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${TAG})"
          } >> $GITHUB_STEP_SUMMARY
