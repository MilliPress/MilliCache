name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Gate: Run CI before building release
  ci:
    name: Run CI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/ci.yml

  # Gate: Run E2E after CI passes
  e2e:
    name: Run E2E
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/e2e.yml

  # Build and publish the release after all gates pass
  build-release:
    name: Build & Release
    needs: [release-please, ci, e2e]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build JS assets
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Download performance results
        uses: actions/download-artifact@v7
        with:
          name: performance-results
          path: /tmp/performance
        continue-on-error: true

      - name: Extract release notes for current version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          CHANGELOG_PATH="docs/01-getting-started/30-changelog.md"

          # Extract only the current version's changelog section
          # Release Please format: ## [version] or ## version
          if [ -f "$CHANGELOG_PATH" ]; then
            # Extract from the version header until the next ## header (or EOF)
            awk -v ver="$VERSION" '
              /^## \[?[0-9]/ {
                if (found) exit
                if (index($0, ver)) found=1
              }
              found { print }
            ' "$CHANGELOG_PATH" > /tmp/changelog.md

            # If nothing was extracted, use a fallback
            if [ ! -s /tmp/changelog.md ]; then
              echo "## ${TAG_NAME}" > /tmp/changelog.md
            fi
          else
            echo "## ${TAG_NAME}" > /tmp/changelog.md
          fi

          echo "Release notes for version $VERSION:"
          cat /tmp/changelog.md

      - name: Append performance summary to changelog
        run: |
          if [ -f /tmp/performance/performance-results.md ]; then
            echo "" >> /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            cat /tmp/performance/performance-results.md >> /tmp/changelog.md
            echo "Performance summary appended to changelog"
          else
            echo "No performance results found, skipping"
          fi

      - name: Create dist build
        run: |
          rm -rf dist && mkdir dist

          # Export tracked files (respects .gitattributes export-ignore)
          git archive --format=tar HEAD | tar -x -C dist

          # Add built JS assets (excluded by .gitattributes export-ignore)
          [ -d build ] && rsync -a build/ dist/build/

          # Download Strauss for namespace scoping
          mkdir -p dist/bin
          curl -sL https://github.com/BrianHenryIE/strauss/releases/download/0.26.5/strauss.phar -o dist/bin/strauss.phar

          # Install production dependencies in the isolated dist directory
          composer install --no-dev --no-interaction --prefer-dist --working-dir=dist

          # Run Strauss to scope dependencies (rewrites source files in dist/)
          (cd dist && php bin/strauss.phar -q)

          # Scope stub namespaces to match scoped dependencies
          sed -i 's/namespace MilliRules\\Builders;/namespace MilliCache\\Deps\\MilliRules\\Builders;/' dist/stubs/*.php

          # Add deps/ classmap to the dist composer.json for the scoped packages
          jq '.autoload.classmap = ["deps/"]' dist/composer.json > dist/composer.json.tmp \
            && mv dist/composer.json.tmp dist/composer.json

          # Regenerate autoloader with scoped deps/ classmap
          composer dump-autoload --no-dev --optimize --classmap-authoritative --working-dir=dist

          # Remove build tools from dist (not needed in the release)
          rm -rf dist/bin

          echo "Dist contents:"
          ls -la dist/

      - name: Create release archive
        run: |
          cd dist
          zip -rq "../millicache.zip" .
          cd ..

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            millicache.zip \
            --clobber

      - name: Update release notes with performance results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/changelog.md ] && [ -s /tmp/changelog.md ]; then
            gh release edit "${{ needs.release-please.outputs.tag_name }}" \
              --notes-file /tmp/changelog.md
            echo "Release notes updated with performance results"
          else
            echo "No changelog file found, skipping release notes update"
          fi

      - name: Release summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release ${TAG} Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Tag | ${TAG} |"
            echo ""
            echo "[View Release](https://github.com/${REPO}/releases/tag/${TAG})"
          } >> $GITHUB_STEP_SUMMARY
