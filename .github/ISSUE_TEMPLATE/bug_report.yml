name: Bug Report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '…'
        2. Click on '…'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: cache-backend
    attributes:
      label: Cache backend
      description: Which key-value store are you using?
      options:
        - Redis
        - KeyDB
        - Dragonfly
        - Valkey
        - Other
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "6.7"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.2"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: MilliCache version
      placeholder: "1.0.2"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional environment info
      description: Hosting provider, OS, other caching plugins, reverse proxy, etc.
      placeholder: "e.g. Kinsta on Ubuntu 24.04, Nginx, no other cache plugins"
    validations:
      required: false

  - type: textarea
    id: debug-info
    attributes:
      label: Debug info
      description: |
        Paste the sanitized debug snapshot you copied from the MilliCache settings page (admin footer → Status → Copy to clipboard).
        The snapshot already redacts hosts, credentials, and customer paths.
      placeholder: "Paste the copied Markdown here."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant error logs or debug output.
      render: shell
    validations:
      required: false