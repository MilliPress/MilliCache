version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group all dev dependencies except key packages
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "predis/*"
          - "millipress/*"
    # These get individual PRs for careful review
    ignore:
      # Don't group these - we want separate PRs
      - dependency-name: "predis/predis"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "millipress/millirules"
        update-types: ["version-update:semver-patch"]
      # Pest 3+ requires PHP 8.2+, Pest 4+ requires PHP 8.3+
      # Our project targets PHP 7.4+ (production) / 8.1+ (dev tooling)
      - dependency-name: "pestphp/pest"
        versions: [">=3.0"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
