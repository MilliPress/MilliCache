version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group all dev dependencies except key packages
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "predis/*"
          - "millipress/*"
    # These get individual PRs for careful review
    ignore:
      # Don't group these - we want separate PRs
      - dependency-name: "predis/predis"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "millipress/millirules"
        update-types: ["version-update:semver-patch"]
      # Pest 5+ would require a future PHP bump — ignore when available
      - dependency-name: "pestphp/pest"
        versions: [">=5.0"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
