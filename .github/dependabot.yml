version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    # Open PRs against the active dev branch, not the default branch (main)
    target-branch: "next"
    schedule:
      interval: "weekly"
    groups:
      # Group all dev dependencies except key packages
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "predis/*"
          - "millipress/*"
    ignore:
      # Pest 5+ would require a future PHP bump — ignore when available
      - dependency-name: "pestphp/pest"
        versions: [">=5.0"]

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "weekly"
