services:
  redis:
    image: redis:latest
    networks:
      - wpenv
  keydb:
    image: eqalpha/keydb:latest
    networks:
      - wpenv
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ulimits:
      memlock: -1
    volumes:
      - dragonflydata:/data
    networks:
      - wpenv

networks:
  wpenv:
    name: ${WP_ENV_NETWORK:-millicache_default}
    external: true

volumes:
  dragonflydata:
